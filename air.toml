[build]
  # Tell Air to build your main server binary
  cmd = "go build -o ./tmp/main ./cmd/server/main.go"
  bin = "./tmp/main"
  
  # Crucial: Add "templ" so Air notices when templates change
  include_ext = ["go", "tpl", "tmpl", "templ", "html"]
  
  # Crucial: Exclude generated templ files to avoid infinite compilation loops
  exclude_regex = [".*_templ.go"]
